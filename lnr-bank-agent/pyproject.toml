[project]
name = "lnrbank"
version = "0.1.0"
description = "Локальный агент сравнения розничных продуктов банков в ЛНР"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "gigachat>=0.2.3,<0.3",
    "certifi>=2024.2.2",
    "pyyaml>=6.0",
]

[project.scripts]
lnrbank = "lnrbank.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnrbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: требует сети и сайтов банков (не запускается в pre-commit)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["lnrbank"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
