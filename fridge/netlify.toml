# Деплой этого приложения на Netlify: в настройках сайта укажите
# Base directory = fridge, тогда Netlify прочитает именно этот файл.
# Секрет ANTHROPIC_API_KEY задаётся в Site configuration → Environment variables.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
