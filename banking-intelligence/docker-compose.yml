# Запуск: cp .env.example .env && (заполнить BOT_TOKEN, ALLOWED_TELEGRAM_IDS) && docker compose up --build
# Redis/Celery добавятся на этапе 2 вместе с реальным сбором данных.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://bankintel:bankintel@db:5432/bankintel
    RAW_STORAGE_DIR: /data/raw
  volumes:
    - raw_data:/data/raw
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bankintel
      POSTGRES_PASSWORD: bankintel
      POSTGRES_DB: bankintel
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankintel"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bankintel:bankintel@db:5432/bankintel
    command: sh -c "alembic upgrade head && bankintel seed"
    depends_on:
      db:
        condition: service_healthy

  bot:
    <<: *app
    command: bankintel bot

  api:
    <<: *app
    command: uvicorn bankintel.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pg_data:
  raw_data:
