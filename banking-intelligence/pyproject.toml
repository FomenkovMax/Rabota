[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankintel"
version = "0.1.0"
description = "Banking Intelligence AI — конкурентный анализ розничных банковских продуктов в ЛНР (демо-прототип)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6",
    "plotly>=5.22",
    "jinja2>=3.1",
    "weasyprint>=62",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

# Зависимости следующих этапов ставятся только когда этап реализован и проверен.
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "pymupdf>=1.24"]
stage2 = ["celery[redis]>=5.4", "redis>=5", "playwright>=1.45", "pymupdf>=1.24"]
stage3 = ["openai>=1.40"]

[project.scripts]
bankintel = "bankintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bankintel = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
