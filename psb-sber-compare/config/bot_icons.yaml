# Значки на кнопках бота из набора эмодзи Telegram — вместо цвета.
#
# Как узнать id: напиши боту /emoji_id, потом отправь ему нужные эмодзи
# одним сообщением — бот ответит id каждого. Вставь id сюда в кавычках
# и перезапусти бота: docker compose restart bot
#
# Пусто — у кнопки обычный эмодзи и цвет. Если Telegram откажет в
# значках (обычно нужен Telegram Premium у владельца бота), бот сам
# вернётся к обычным кнопкам и напишет об этом в лог.

refresh_all: ""       # Обновить все банки
export: ""            # Выгрузить общий свод
ai: ""                # AI-консультант
refresh_one: ""       # Обновить один банк
compare_psb: ""       # Сравнить Сбер и ПСБ
compare_vtb: ""       # Сравнить Сбер и ВТБ
compare_cmr: ""       # Сравнить Сбер и ЦМР
