# Настройки инструмента сравнения розничных продуктов.
# Формат — YAML, правится руками.

# Регион сбора. Доступно: lugansk, moscow.
region: lugansk
region_label: "Луганская Народная Республика"

# Пороги светофора в процентных пунктах. parity_pp заодно задаёт «в рынке»
# в разделе «Место Сбера»: отклонение от медианы остальных банков не больше.
thresholds:
  parity_pp: 0.5   # разница меньше — паритет (жёлтый)
  loss_pp: 1.0     # отставание от этой величины — красный

# Ключевая ставка ЦБ берётся сама с cbr.ru на дату каждого сбора. Задавать
# руками нужно, только если сайт ЦБ с сервера недоступен; ставка из этого
# блока применяется лишь к сбору того дня, который в ней указан.
# key_rate:
#   value: 14.0
#   date: 2026-10-06

# Банки. Сбер — наш, остальные конкуренты.
#
# Привязка к ЛНР у каждого банка — одним из способов:
#   region_cookies: [...]  — регион выбирается на сайте, задаём его куками;
#   region_mode: local     — банк работает только в ЛНР, выбора региона нет:
#                            условия на сайте и есть луганские;
#   region_mode: federal   — про ЛНР и новые территории на сайте ничего нет,
#                            действуют единые условия по РФ. Ставить только
#                            после проверки, что регион на сайте не выбирается;
#   ничего                 — регион не задан: условия по адресу сервера
#                            (Москва), в отчёте с предупреждением.
# Отключённый банк не собирается и не попадает в сравнение.
banks:
  sber:
    sitemap: true         # страницы розницы из карты сайта, а не только по ссылкам
    # Присутствие в ЛНР — источник для аудита (охват банков).
    presence_source: "https://bankprofi.ru/blog/sberbank-v-lnr-karty-uslugi-rezhim-raboty-bankomaty"
    enabled: true
    # Сколько ждать один раздел, секунды. Защита Сбера то отдаёт страницу
    # за восемь секунд, то закручивает проверку надолго; по истечении
    # срока раздел помечается неудачным, а обход идёт дальше.
    section_timeout_s: 90
    # Сколько страниц читать за один обход, не больше. У розницы Сбера
    # витрин и продуктов порядка шести десятков; упёрся в предел — лог
    # скажет, сколько осталось в очереди.
    # 28.10.2026: 80 не хватало — в очереди осталось 53 страницы, среди них
    # продукты («Выгодный старт плюс», «СберКарта Премиальная» кредитная,
    # «Автонакопления»). С картой сайта и фильтром мусора — до 220.
    max_pages: 220
    # Пауза между страницами, секунды. В первом сборе после ~30 страниц
    # подряд защита Сбера начала отдавать заглушку вместо страниц. Реже —
    # дольше, но без блокировки. Если заглушка всё же пришла, обход ждёт
    # block_pause_s и пробует ещё раз; не помогло — останавливается.
    # 27.10.2026: защита Сбера срабатывает на частые заходы — пауза больше,
    # после заглушки ждём 10 минут и пробуем ещё дважды.
    pause_s: 10
    block_pause_s: 600    # пауза после заглушки защиты, секунды
    block_retries: 2      # сколько раз пробовать после паузы
    # Калькулятор на странице: агент выбирает регион «Луганская Народная
    # Республика, Луганск», выключает зарплатную скидку и перебирает все цели
    # из списка — что доступно в ЛНР и по какой ставке. Калькулятор один на
    # все страницы ипотеки, поэтому читаем его на двух-трёх страницах, а не
    # на каждой: каждый проход — до полутора минут.
    # Витрина /credits/homenew убрана (28.10.2026): калькулятора на ней агент
    # не нашёл, а время на поиск съело чтение самой витрины.
    # Калькулятор ипотеки с полем «Регион покупки недвижимости» — на вкладке
    # «Об ипотеке» страницы новостройки (ссылка заказчика 28.10.2026:
    # /credits/home/buying_project?tab=about); на вторичке и залоге — свои.
    # С 28.10.2026 — все кредитные страницы: у автокредита, наличных и
    # рефинансирования калькуляторы «сумма и срок → платёж». Один и тот же
    # калькулятор ипотеки на разных страницах перебирается один раз.
    calculator_paths: "/ru/person/credits/(home|money)/[\\w-]+$"
    # Программы, которые на сайте есть, но в ЛНР не выдаются, — в рейтинг
    # не идут, в отчёте помечены «недоступно в регионе» с причиной.
    not_in_region:
      - path: /ru/person/credits/home/buying_complete_house
        note: "калькулятор на сайте Сбера для «Луганская Народная Республика, Луганск»
          и цели «Квартира на вторичном рынке» пишет «Программа недоступна в вашем
          регионе» и предлагает новостройку с программой «Региональная»
          (проверено вручную 28.10.2026)"
    # Регион на сайте Сбера. region_id 94 — Луганская Народная Республика,
    # код взят из куки живой сессии с выбранным регионом. Две остальные
    # куки говорят сайту, что регион выбран руками: без них он определит
    # его по адресу сервера и вернёт московские условия.
    # Как обновить, если коды поменяются: открыть www.sberbank.ru, выбрать
    # регион, F12 → Хранилище → Куки → отфильтровать по «region».
    region_cookies:
      - {name: "sbrf.region_id",     value: "94",   domain: "www.sberbank.ru"}
      - {name: "sbrf.region_manual", value: "true", domain: "www.sberbank.ru"}
      - {name: "sbrf.region_set",    value: "true", domain: "www.sberbank.ru"}
  psb:
    presence_source: "https://bankprofi.ru/blog/kakie-banki-rabotayut-v-lnr-v-2026-godu"
    enabled: true
    pause: 1.5            # пауза между страницами, секунды
    timeout: 30
    retries: 3
    throttle_backoff: 30  # сколько ждать при 403/429
    sections: []          # пусто = весь розничный блок (~300 страниц, ~12 мин)
    include_promos: true
    max_pages: 0          # 0 = без ограничения; поставь 30 для быстрой пробы
  vtb:
    sitemap: true         # страницы розницы из карты сайта, а не только по ссылкам
    presence_source: "https://bankprofi.ru/blog/kakie-banki-rabotayut-v-lnr-v-2026-godu"
    enabled: true         # проверено check-bank vtb 07.10.2026
    max_pages: 60         # 40 не хватало до карт (аудит 07.10.2026)
    pause_s: 6
    # Выбора города на vtb.ru нет (проверил заказчик 07.10.2026): кука
    # user_region ставится сама по адресу посетителя (MOW), вручную не
    # меняется. ЛНР в подвале упомянута только номером телефона. По правилу
    # заказчика это единые условия по РФ; условия для новых регионов — на
    # отдельной странице ипотеки, она в главных продуктах адаптера.
    region_mode: federal
    # Калькулятор: если в нём есть выбор региона, агент выберет ЛНР и узнает,
    # что доступно в Луганске (сайт целиком — федеральный). Страницы —
    # главные программы, в том числе отдельная для новых регионов.
    calculator_paths: "/personal/(ipoteka|kredit|avtokredity)/[\\w-]*$"
  tbank:
    sitemap: true         # страницы розницы из карты сайта, а не только по ссылкам
    presence_source: "https://bankprofi.ru/blog/kakie-banki-rabotayut-v-lnr-v-2026-godu"
    enabled: true         # проверен check-bank 07.10.2026
    # Условия Т-Банка едины по РФ (подтвердил заказчик 07.10.2026).
    region_mode: federal
    max_pages: 40
    pause_s: 6
    calculator_paths: "/mortgage/?$|/loans/[\\w-]+/?$"
  rostfinance:
    sitemap: true         # страницы розницы из карты сайта, а не только по ссылкам
    presence_source: "https://www.rostfinance.ru/ (город Луганск в списке городов, проверено 07.10.2026)"
    enabled: true         # проверен check-bank 07.10.2026, регион Луганск
    max_pages: 40
    pause_s: 4
    # Город на сайте РостФинанса — кука current_region_normal. 1877 —
    # значение после выбора «Луганск» (браузер заказчика, 07.10.2026).
    # Без неё сайт определяет город по адресу сервера (Санкт-Петербург).
    # Как обновить: rostfinance.ru → город в шапке → Луганск, F12 →
    # Хранилище → Куки → current_region_normal.
    region_cookies:
      - {name: "current_region_normal", value: "1877", domain: "www.rostfinance.ru"}
    calculator_paths: "/(mortgage|credit)/[\\w-]+/?$"
  cmr:
    presence_source: "https://cmrbank.ru/offices/69/69002.html"
    # Разделов нет в меню сайта (07.10.2026) — в охвате эти клетки не считаются.
    coverage_not_offered: ["Ипотека", "Кредитные карты", "Автокредиты", "Инвестиции",
                           "НПФ и ПДС", "Сейфовые ячейки"]
    enabled: true
    # ЦМР работает только в ЛНР, выбора региона на сайте нет: условия
    # на сайте и есть луганские.
    region_mode: local

# Браузер — для банков, которые показывают JS-проверку до содержимого.
browser:
  headless: true
  timeout_ms: 45000
  settle_ms: 5000         # сколько ждать отработки скриптов
  pause_s: 2.0            # пауза между страницами
  proxy: ""               # http://host:port, если нужен
  # Включать только если корневой сертификат НУЦ Минцифры не установлен
  # в систему. Это ослабляет проверку подлинности сайта — лучше поставить
  # сертификат: https://www.gosuslugi.ru/crt
  ignore_https_errors: true   # ВРЕМЕННО для песочницы; на VPS поставь false и установи сертификат

# Хранилище и отчёт.
storage:
  db_path: "data/banks.db"
  history_days: 365       # глубина истории — календарный год

report:
  output: "data/dashboard.html"
  keep_dated_copy: true

export:
  dir: "data/export"
  bi_dir: "data/bi"       # CSV для Power BI / DataLens, история всех срезов
  audit_dir: "data/audit" # автоаудит: HTML-отчёт и пакет для LLM-аудита

notify:
  digest_file: "data/changes_digest.txt"
  only_significant: true
