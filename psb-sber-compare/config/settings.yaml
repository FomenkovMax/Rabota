# Настройки инструмента сравнения ПСБ / Сбер.
# Формат — YAML. Правится руками, перезапуск кода не нужен.

# Регион сбора. Доступно: lugansk, moscow.
# Проверено: смена региона реально меняет ставки по вкладам на сайте ПСБ.
region: lugansk

# Как называть регион в отчёте.
region_label: "Луганская Народная Республика"

# Пороги светофора в процентных пунктах.
thresholds:
  parity_pp: 0.5   # разница меньше — считаем паритетом (жёлтый)
  loss_pp: 1.0     # отставание от этой величины — красный

# Сбор данных ПСБ.
psb:
  # Пауза между запросами, секунды. Меньше 0.5 ставить не стоит:
  # это вежливость к чужому серверу, а не обход защиты.
  pause: 1.0
  timeout: 30
  retries: 3
  # Разделы розницы. Пустой список = все разделы из catalog.RETAIL_SECTIONS.
  sections: ["loans", "saving", "savingsaccount"]
  # Собирать ли страницы акций (они разбросаны по всему /personal).
  include_promos: true
  # Ограничение числа страниц за запуск. 0 = без ограничения.
  # Полезно для первого прогона: поставь 30, чтобы проверить всё быстро.
  max_pages: 0

# Данные Сбера.
sber:
  # Путь к выгрузке: .xlsx, .csv или .json. Формат распознаётся автоматически.
  source: "data/sber.xlsx"

# Хранилище и отчёт.
storage:
  db_path: "data/psb_sber.db"
  history_days: 365      # глубина истории — календарный год

report:
  output: "data/dashboard.html"
  # Класть ли рядом копию с датой в имени, чтобы был архив отчётов.
  keep_dated_copy: true

# Уведомления об изменениях.
notify:
  # Писать сводку в файл — его удобно читать глазами или цеплять к рассылке.
  digest_file: "data/changes_digest.txt"
  # Уведомлять только если есть изменения уровня high/medium.
  only_significant: true
