# ЧЕРНОВИК пар для светофора — подготовлен по сбору 07.10.2026 (аудит).
# В отчёт НЕ попадает: светофор читает только config/product_map.yaml.
#
# Как подтвердить: просмотреть пары, удалить сомнительные и перенести
# оставшиеся в product_map.yaml (раздел pairs). Решение за человеком:
# пара — это утверждение «продукты сопоставимы», и ошибка в ней — неверная
# цифра у руководителя.
#
# competitor — путь страницы продукта конкурента (как в ссылке отчёта),
# sber — путь страницы продукта Сбера.

pairs:
  # --- Кредит наличными -----------------------------------------------------
  - {bank: psb, competitor: /personal/loans/kredit-nalichnymi,
     sber: /ru/person/credits/money/consumer_unsecured, label: Кредит наличными, category: Кредиты}
  - {bank: vtb, competitor: /personal/kredit/nalichnymi,
     sber: /ru/person/credits/money/consumer_unsecured, label: Кредит наличными, category: Кредиты}
  - {bank: tbank, competitor: /loans/cash-loan,
     sber: /ru/person/credits/money/consumer_unsecured, label: Кредит наличными, category: Кредиты}
  - {bank: cmr, competitor: /person/person-loans/credit-for-everything/,
     sber: /ru/person/credits/money/consumer_unsecured, label: Кредит наличными («Кредит на всё»), category: Кредиты}

  # --- Рефинансирование -----------------------------------------------------
