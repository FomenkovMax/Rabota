# Ручное сопоставление продуктов ПСБ и Сбера.
#
# ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ПАР ДЛЯ ОТЧЁТА.
# Автоматический матчинг по названию в отчёт не попадает: «Кредит наличными»
# и «Потребительский кредит» похожи по имени, но могут отличаться условиями
# допуска. Цена ошибки — неверная цифра в отчёте у руководителя.
#
# Как заполнять:
#   1. Запусти:  python run.py suggest
#      Скрипт положит черновые пары в data/pairs_suggested.yaml
#   2. Перенеси сюда те, что подтвердил глазами.
#
# Поля пары:
#   psb      — путь страницы ПСБ (например /personal/loans/kredit-nalichnymi)
#              или точное название продукта
#   sber     — ключ или название продукта из выгрузки Сбера
#   label    — как назвать пару в отчёте
#   category — категория; влияет на светофор! Для «Вклады»,
#              «Накопительные счета», «Долгосрочные сбережения»
#              выгодой клиента считается ставка ВЫШЕ, для остальных — НИЖЕ.

pairs:
  # ВРЕМЕННЫЕ пары на примере демо-выгрузки Сбера (data/sber_example.xlsx).
  # Замени на реальные, когда придёт настоящая выгрузка.

  - psb: /personal/loans/kredit-nalichnymi
    sber: sber_cash
    label: Кредит наличными
    category: Кредиты

  - psb: /personal/loans/refinancing
    sber: sber_refin
    label: Рефинансирование
    category: Кредиты

  - psb: /personal/loans/auto
    sber: sber_auto
    label: Автокредит
    category: Кредиты

  - psb: /personal/saving/myincome
    sber: sber_deposit
    label: Срочный вклад
    category: Вклады

  - psb: /personal/savingsaccount/accentpercent
    sber: sber_savings
    label: Накопительный счёт
    category: Накопительные счета
