# Ручное сопоставление продуктов Сбера с продуктами конкурентов.
#
# ЭТОТ ФАЙЛ — ЕДИНСТВЕННЫЙ ИСТОЧНИК ПАР ДЛЯ ОТЧЁТА.
# Автоматический матчинг по названию в отчёт не попадает: он готовит
# черновик, а решение принимает человек. «Кредит наличными» и
# «Потребительский кредит» похожи по имени, но могут отличаться условиями
# допуска, и ошибка в паре — неверная цифра в отчёте у руководителя.
#
# Как заполнять:
#   1. python run.py collect
#   2. python run.py suggest        → data/pairs_suggested.yaml
#   3. проверь глазами и перенеси подтверждённые пары сюда
#
# Поля пары:
#   bank       — код банка-конкурента: psb, vtb, genbank, cmr
#   competitor — путь страницы или точное название продукта конкурента
#   sber       — ключ или название продукта Сбера
#   label      — как назвать пару в отчёте
#   category   — влияет на светофор! Для «Вклады», «Накопительные счета»
#                и «Долгосрочные сбережения» выгодой клиента считается
#                ставка ВЫШЕ, для кредитных продуктов — НИЖЕ.

pairs: []
  # Пример заполненной пары:
  #
  # - bank: psb
  #   competitor: /personal/loans/kredit-nalichnymi
  #   sber: Кредит наличными
  #   label: Кредит наличными
  #   category: Кредиты
