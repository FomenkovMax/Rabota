# Настройки, которые можно менять без правки кода

scrape:
  delay_min_s: 1.0        # пауза между каналами (вежливый парсинг)
  delay_max_s: 2.5
  retries: 3
  timeout_s: 20
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  max_posts_per_channel: 40   # сколько последних постов смотрим за один заход
  first_run_hours: 24         # если прошлого запуска нет — смотрим за столько часов
  max_text_chars: 3000        # длинные посты обрезаем перед отправкой в LLM

dedup:
  similarity_threshold: 88    # 0..100, похожесть текста (rapidfuzz token_set_ratio)
  history_days: 3             # сколько дней помним события и посты (повтор позже = не новая новость)
  llm_max_calls: 15           # максимум проверок «одна ли это новость» дешёвой моделью за запуск

llm:
  filter_batch_size: 15       # постов в одном запросе дешёвого фильтра
  max_retries: 2              # повтор при невалидном JSON
  low_balance_warn: 2000000   # меньше стольких токенов — предупреждение в дайджесте и админу (подбери под свои расходы)
  min_balance_to_run: 20000   # меньше — запуск не начинаем: токены закончились
  # Цена за 1 млн токенов в USD — ЗАПОЛНИ по тарифам своего прокси.
  # Пока null — стоимость в логе будет «н/д» (токены считаются всегда).
  prices:
    filter:  {input: null, output: null}
    analyze: {input: null, output: null}

digest:
  every_hours: 4              # (запасной вариант, если не задан schedule_hours)
  schedule_hours: [0, 4, 8, 12, 16, 20]   # часы (МСК) ТИХОГО фонового сбора в базу — получателям ничего не уходит
  daily_hour: 15              # раз в день в 15:00 (МСК) всем уходит дайджест дня с кнопками оценки
  daily_minute: 0
  daily_max_cards: 15         # сколько новостей-карточек с кнопками в дневной рассылке (остальное в HTML/Excel)
  send_dm: true               # кроме группы слать и в личку (ALLOWED_USER_IDS, кто не нажал /mute); false — только в группу
  timezone: Europe/Moscow
  max_events: 12              # сколько событий в сообщении (остальное в дашборде)
  min_score: 3                # в Telegram-дайджест попадают события от 3 звёзд
  dashboard_min_score: 2      # в HTML-дашборд и Excel — от 2 звёзд

enrichment:
  cache_ttl_days: 7
  dadata: {enabled: true}
  companium: {enabled: false}   # включишь после проверки robots.txt (этап 2)
  busgov: {enabled: false}

finance:
  # Доля сотрудников, которые перейдут на зарплатный проект Сбера, и годовая
  # доходность пакета (доля от годового ФОТ). TODO(Макс): уточни у коллег.
  salary_share: 0.5
  package_yield: 0.02         # доходность пакета услуг: доля от ФОТ в год. TODO(Макс): заглушка, уточни
  months: 12
